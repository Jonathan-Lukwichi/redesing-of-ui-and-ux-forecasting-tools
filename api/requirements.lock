# Exact, reproducible dependency set for the production Docker image
# (python:3.12-slim, linux x86_64). The Dockerfile installs THIS file, not
# requirements.txt, so a new upstream release can never change a deploy on
# its own. Every entry has a prebuilt wheel for cp312/manylinux.
#
# requirements.txt lists what the app needs and why; this file lists exactly
# what was tested. To upgrade: change a version here deliberately, run the
# backend tests, then push. (PuLP 4.0 broke the Sep 2026 deploy this way.)
