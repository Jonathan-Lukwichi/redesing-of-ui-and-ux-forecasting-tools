services:
  - type: web
    name: healthforecast
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATA_REPO
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFY_FROM_EMAIL
        sync: false
      # Authentication. AUTH_USERS holds user:role:scrypt-hash entries and
      # AUTH_SECRET signs the session cookies; both are secrets, so sync:false
      # keeps them out of the repo and in Render's dashboard.
      - key: AUTH_MODE
        value: protected
      - key: AUTH_USERS
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      # Render terminates TLS and overwrites X-Forwarded-For, so it is safe to
      # key rate limits on it here.
      - key: TRUST_PROXY
        value: "1"

