services:
  - type: web
    name: healthforecast
    runtime: docker
    plan: starter
    healthCheckPath: /docs
    envVars:
      - key: DATA_REPO
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFY_FROM_EMAIL
        sync: false
