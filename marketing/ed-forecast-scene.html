<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HealthForecast, cinematic demo scene</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --room0: #01030a;
    --room1: #0a1428;
    --surface: #060b16;
    --panel: rgba(148, 180, 255, 0.045);
    --panel-line: rgba(148, 180, 255, 0.13);
    --ink: #e8eef7;
    --ink-2: #9db0c7;
    --ink-3: #64748b;
    --green: #16a679;
    --green-soft: rgba(22, 166, 121, 0.14);
    --red: #e5484d;
    --red-soft: rgba(229, 72, 77, 0.14);
    --hist: #5b8ed6;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; overflow: hidden; }

  body {
    background: radial-gradient(120% 90% at 50% 30%, var(--room1) 0%, var(--room0) 70%);
    font-family: "Inter", "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- room ---------- */

  #particles {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    z-index: 1;
  }

  .floor {
    position: fixed;
    left: -40%; right: -40%; bottom: -6%;
    height: 60vh;
    background-image:
      linear-gradient(rgba(90, 130, 210, 0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(90, 130, 210, 0.08) 1px, transparent 1px);
    background-size: 52px 52px;
    transform: perspective(650px) rotateX(74deg);
    transform-origin: top center;
    -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0.75), transparent 72%);
    mask-image: linear-gradient(to bottom, rgba(0,0,0,0.75), transparent 72%);
    z-index: 0;
  }

  .glow {
    position: fixed;
    left: 50%; top: 44%;
    width: 96vw; height: 76vh;
    transform: translate(-50%, -50%);
    background: radial-gradient(closest-side,
      rgba(48, 96, 190, 0.17),
      rgba(22, 166, 121, 0.05) 55%,
      transparent 78%);
    z-index: 0;
    animation: breathe 11s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.85; }
    50%      { opacity: 1.15; }
  }

  .vignette {
    position: fixed; inset: 0;
    background: radial-gradient(115% 95% at 50% 42%, transparent 55%, rgba(0, 0, 0, 0.6) 100%);
    z-index: 4;
    pointer-events: none;
  }

  /* ---------- monitor rig ---------- */

  .stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    z-index: 2;
    perspective: 1600px;
  }

  .rig {
    display: flex; flex-direction: column; align-items: center;
    transform-style: preserve-3d;
    animation: drift 22s ease-in-out infinite;
  }
  @keyframes drift {
    0%   { transform: rotateY(-1.3deg) rotateX(0.5deg); }
    50%  { transform: rotateY(1.3deg)  rotateX(-0.4deg); }
    100% { transform: rotateY(-1.3deg) rotateX(0.5deg); }
  }

  .monitor {
    width: min(80vw, calc((100vh - 200px) * 16 / 9));
    min-width: 640px;
    padding: 11px 11px 15px;
    border-radius: 20px;
    background: linear-gradient(180deg, #1c2434 0%, #0d1220 55%, #070b14 100%);
    border: 1px solid rgba(160, 185, 230, 0.22);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.10),
      inset 0 -1px 0 rgba(0, 0, 0, 0.6),
      0 24px 70px rgba(0, 0, 0, 0.65),
      0 4px 22px rgba(20, 60, 140, 0.18);
    position: relative;
  }

  .monitor::after {              /* power LED on the bezel */
    content: "";
    position: absolute;
    left: 50%; bottom: 5px;
    width: 5px; height: 5px;
    border-radius: 50%;
    transform: translateX(-50%);
    background: var(--green);
    box-shadow: 0 0 8px rgba(22, 166, 121, 0.9);
    animation: led 4s ease-in-out infinite;
  }
  @keyframes led {
    0%, 100% { opacity: 0.7; }
    50%      { opacity: 1; }
  }

  .screen {
    position: relative;
    aspect-ratio: 16 / 9;
    border-radius: 10px;
    background: var(--surface);
    overflow: hidden;
    border: 1px solid rgba(0, 0, 0, 0.8);
  }

  .stand {
    width: 84px; height: 58px;
    background: linear-gradient(180deg, #141b2b, #0a0f1b);
    clip-path: polygon(30% 0, 70% 0, 88% 100%, 12% 100%);
    border-bottom: 1px solid rgba(160, 185, 230, 0.15);
  }
  .base {
    width: 240px; height: 12px;
    border-radius: 50%;
    background: linear-gradient(180deg, #182136, #0a0f1b);
    border: 1px solid rgba(160, 185, 230, 0.12);
  }
  .shadow {
    width: 340px; height: 26px;
    margin-top: 10px;
    border-radius: 50%;
    background: radial-gradient(closest-side, rgba(0, 0, 0, 0.75), transparent);
  }

  /* ---------- inside the screen ---------- */

  .scanlines {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255, 255, 255, 0.016) 0px,
      rgba(255, 255, 255, 0.016) 1px,
      transparent 1px,
      transparent 3px);
    z-index: 6;
    pointer-events: none;
  }

  .sweep {
    position: absolute; top: -20%; bottom: -20%;
    width: 34%;
    background: linear-gradient(100deg,
      transparent 0%,
      rgba(210, 230, 255, 0.045) 45%,
      rgba(210, 230, 255, 0.075) 50%,
      rgba(210, 230, 255, 0.045) 55%,
      transparent 100%);
    transform: skewX(-14deg) translateX(-360%);
    animation: sweep 9.5s ease-in-out infinite;
    z-index: 7;
    pointer-events: none;
  }
  @keyframes sweep {
    0%, 55%  { transform: skewX(-14deg) translateX(-360%); }
    75%, 100%{ transform: skewX(-14deg) translateX(460%); }
  }

  .boot {
    position: absolute; inset: 0;
    background: #000;
    z-index: 8;
    pointer-events: none;
  }

  /* the dashboard is laid out at a fixed 1280 x 720 and scaled to fit the screen */
  #dashWrap {
    position: absolute; top: 0; left: 0;
    width: 1280px; height: 720px;
    transform-origin: 0 0;
  }

  .dash {
    width: 100%; height: 100%;
    padding: 30px 40px 26px;
    display: flex; flex-direction: column;
    gap: 16px;
    background:
      radial-gradient(90% 60% at 50% 0%, rgba(40, 90, 190, 0.10), transparent 70%),
      var(--surface);
  }

  .fade-item { opacity: 0; }

  /* header */
  .hd {
    display: flex; align-items: center; gap: 16px;
  }
  .wordmark {
    font-family: "Space Grotesk", "Inter", sans-serif;
    font-weight: 700; font-size: 21px;
    letter-spacing: 0.16em;
  }
  .wordmark b { color: var(--green); font-weight: 700; }
  .urlchip {
    font-size: 12.5px; font-weight: 500;
    color: var(--ink-2);
    padding: 5px 13px;
    border: 1px solid var(--panel-line);
    border-radius: 999px;
    background: var(--panel);
    letter-spacing: 0.02em;
  }
  .live {
    margin-left: auto;
    display: flex; align-items: center; gap: 8px;
    font-family: "Space Grotesk", sans-serif;
    font-size: 11.5px; font-weight: 600;
    letter-spacing: 0.22em;
    color: var(--green);
    padding: 5px 13px;
    border: 1px solid rgba(22, 166, 121, 0.35);
    border-radius: 999px;
    background: var(--green-soft);
  }
  .beacon {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--green);
    position: relative;
  }
  .beacon::after {
    content: "";
    position: absolute; inset: -1px;
    border-radius: 50%;
    border: 1px solid var(--green);
    animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
  }
  @keyframes ping {
    0%   { transform: scale(1);   opacity: 0.9; }
    100% { transform: scale(3.2); opacity: 0; }
  }

  /* KPI row */
  .kpi {
    display: flex; align-items: flex-end; gap: 26px;
  }
  .kpi-label {
    font-family: "Space Grotesk", sans-serif;
    font-size: 12.5px; font-weight: 600;
    letter-spacing: 0.18em;
    color: var(--ink-3);
    margin-bottom: 7px;
  }
  .kpi-num {
    display: flex; align-items: baseline; gap: 12px;
  }
  #bigNum {
    font-family: "Space Grotesk", sans-serif;
    font-size: 68px; font-weight: 700;
    line-height: 0.95;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 30px rgba(22, 166, 121, 0.35);
  }
  .unit { font-size: 17px; font-weight: 500; color: var(--ink-2); }
  .peak {
    margin-left: auto; margin-bottom: 8px;
    display: flex; align-items: center; gap: 9px;
    font-family: "Space Grotesk", sans-serif;
    font-size: 14px; font-weight: 600;
    letter-spacing: 0.06em;
    color: #ff9296;
    padding: 9px 18px;
    border: 1px solid rgba(229, 72, 77, 0.5);
    border-radius: 12px;
    background: var(--red-soft);
    box-shadow: 0 0 22px rgba(229, 72, 77, 0.28), inset 0 0 14px rgba(229, 72, 77, 0.10);
    position: relative;
    opacity: 0;
  }
  .peak-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--red);
    box-shadow: 0 0 9px rgba(229, 72, 77, 0.9);
    position: relative;
  }
  .peak-dot::after {
    content: "";
    position: absolute; inset: -1px;
    border-radius: 50%;
    border: 1px solid var(--red);
    animation: ping 2.4s cubic-bezier(0, 0, 0.2, 1) infinite;
  }

  /* chart panel */
  .panel {
    border: 1px solid var(--panel-line);
    border-radius: 16px;
    background: var(--panel);
    backdrop-filter: blur(8px);
    padding: 16px 22px 10px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
  }
  .panel-hd {
    display: flex; align-items: center;
    margin-bottom: 4px;
  }
  .panel-title {
    font-family: "Space Grotesk", sans-serif;
    font-size: 12px; font-weight: 600;
    letter-spacing: 0.16em;
    color: var(--ink-3);
  }
  .legend {
    margin-left: auto;
    display: flex; gap: 18px;
    font-size: 11.5px; color: var(--ink-2);
  }
  .legend span { display: flex; align-items: center; gap: 7px; }
  .sw { width: 16px; height: 3px; border-radius: 2px; display: inline-block; }
  .sw.hist  { background: var(--hist); }
  .sw.fc    { background: var(--green); box-shadow: 0 0 6px rgba(22, 166, 121, 0.7); }
  .sw.band  { height: 9px; background: rgba(22, 166, 121, 0.18); border-radius: 3px; }

  #chart { display: block; }

  .grid-line   { stroke: rgba(148, 180, 255, 0.09); stroke-width: 1; }
  .grid-label  { fill: var(--ink-3); font-size: 10.5px; font-family: "Inter", sans-serif; }
  .axis-label  { fill: var(--ink-3); font-size: 10.5px; font-family: "Space Grotesk", sans-serif; letter-spacing: 0.1em; }
  .day-label   { fill: var(--ink-2); font-size: 10.5px; font-family: "Space Grotesk", sans-serif; font-weight: 600; }

  #histPath {
    fill: none;
    stroke: var(--hist);
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  #fcPath {
    fill: none;
    stroke: var(--green);
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 6px rgba(22, 166, 121, 0.75));
  }
  #band { fill: rgba(22, 166, 121, 0.13); }
  #divider {
    stroke: rgba(200, 220, 255, 0.4);
    stroke-width: 1.5;
    stroke-dasharray: 5 6;
    opacity: 0;
  }
  #dividerLabel {
    fill: var(--ink-2);
    font-size: 10.5px;
    font-family: "Space Grotesk", sans-serif;
    letter-spacing: 0.18em;
    opacity: 0;
  }
  #tracer {
    fill: #3ddfa9;
    filter: drop-shadow(0 0 8px rgba(22, 166, 121, 1));
    opacity: 0;
  }
  #tracerHalo { fill: rgba(22, 166, 121, 0.22); opacity: 0; }

  /* day tiles */
  .tiles {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 14px;
  }
  .tile {
    border: 1px solid var(--panel-line);
    border-radius: 14px;
    background: var(--panel);
    backdrop-filter: blur(8px);
    padding: 12px 10px 11px;
    text-align: center;
    opacity: 0;
    transform: translateY(14px) scale(0.96);
  }
  .tile .d {
    font-family: "Space Grotesk", sans-serif;
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.2em;
    color: var(--ink-3);
    margin-bottom: 5px;
  }
  .tile .n {
    font-family: "Space Grotesk", sans-serif;
    font-size: 27px; font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .tile.hot {
    border-color: rgba(229, 72, 77, 0.55);
    background: var(--red-soft);
    box-shadow: 0 0 24px rgba(229, 72, 77, 0.3), inset 0 0 16px rgba(229, 72, 77, 0.1);
  }
  .tile.hot .d { color: #ff9296; }
  .tile.hot .n { color: #ff9296; text-shadow: 0 0 14px rgba(229, 72, 77, 0.6); }

  /* caption + action bar */
  .caption {
    text-align: center;
    font-size: 15px; font-weight: 400;
    color: var(--ink-2);
    letter-spacing: 0.01em;
    opacity: 0;
  }
  .caption em { color: var(--ink); font-style: normal; font-weight: 600; }

  .action {
    margin-top: auto;
    display: flex; align-items: center; gap: 12px;
    border: 1px solid var(--panel-line);
    border-radius: 13px;
    background: rgba(6, 12, 24, 0.75);
    padding: 13px 20px;
    font-size: 15px; font-weight: 500;
    opacity: 0;
  }
  .prompt {
    font-family: "Space Grotesk", sans-serif;
    color: var(--green); font-weight: 700;
  }
  #planText { color: var(--ink); letter-spacing: 0.01em; }
  #caret {
    display: inline-block;
    width: 8px; height: 17px;
    margin-left: 2px;
    background: var(--green);
    vertical-align: text-bottom;
    animation: blink 1s steps(1) infinite;
    opacity: 0;
  }
  @keyframes blink { 50% { visibility: hidden; } }

  /* ---------- controls ---------- */

  .controls {
    position: fixed;
    right: 14px; bottom: 12px;
    display: flex; gap: 8px;
    z-index: 10;
    opacity: 0.32;
    transition: opacity 0.25s;
  }
  .controls:hover { opacity: 0.85; }
  .controls button {
    font-family: "Inter", sans-serif;
    font-size: 11px; font-weight: 500;
    color: var(--ink-2);
    background: rgba(10, 18, 34, 0.85);
    border: 1px solid var(--panel-line);
    border-radius: 7px;
    padding: 5px 11px;
    cursor: pointer;
  }
  .controls button:hover { color: var(--ink); border-color: rgba(148, 180, 255, 0.3); }

  /* ---------- reduced motion ---------- */

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
</head>
<body>

<div class="floor"></div>
<div class="glow"></div>
<canvas id="particles"></canvas>

<div class="stage">
  <div class="rig">
    <div class="monitor">
      <div class="screen" id="screen">
        <div id="dashWrap">
          <div class="dash">

            <div class="hd fade-item" id="hdRow">
              <div class="wordmark">HEALTH<b>FORECAST</b></div>
              <div class="urlchip">healthforecast.jlwanalytics.com</div>
              <div class="live"><span class="beacon"></span>LIVE</div>
            </div>

            <div class="kpi">
              <div class="fade-item" id="kpiBlock">
                <div class="kpi-label">NEXT 7 DAYS &middot; TOTAL ED ARRIVALS</div>
                <div class="kpi-num">
                  <span id="bigNum">0</span>
                  <span class="unit">patients</span>
                </div>
              </div>
              <div class="peak" id="peakBadge"><span class="peak-dot"></span>Peak: Thu</div>
            </div>

            <div class="panel fade-item" id="chartPanel">
              <div class="panel-hd">
                <div class="panel-title">DAILY ED ARRIVALS</div>
                <div class="legend">
                  <span><i class="sw hist"></i>Actuals</span>
                  <span><i class="sw fc"></i>Forecast</span>
                  <span><i class="sw band"></i>Likely range</span>
                </div>
              </div>
              <svg id="chart" width="1152" height="266" viewBox="0 0 1152 266" role="img"
                   aria-label="Line chart: 14 days of actual arrivals, then a 7 day forecast with a likely range band, peaking Thursday at 77"></svg>
            </div>

            <div class="tiles" id="tiles">
              <div class="tile" data-v="59"><div class="d">MON</div><div class="n">0</div></div>
              <div class="tile" data-v="66"><div class="d">TUE</div><div class="n">0</div></div>
              <div class="tile" data-v="71"><div class="d">WED</div><div class="n">0</div></div>
              <div class="tile hot" data-v="77"><div class="d">THU</div><div class="n">0</div></div>
              <div class="tile" data-v="68"><div class="d">FRI</div><div class="n">0</div></div>
              <div class="tile" data-v="55"><div class="d">SAT</div><div class="n">0</div></div>
              <div class="tile" data-v="50"><div class="d">SUN</div><div class="n">0</div></div>
            </div>

            <div class="caption" id="caption">
              Each day carries a likely range. <em>Plan with the range, not the point.</em>
            </div>

            <div class="action" id="action">
              <span class="prompt">&#9656;</span>
              <span><span id="planText"></span><span id="caret"></span></span>
            </div>

          </div>
        </div>
        <div class="sweep"></div>
        <div class="scanlines"></div>
        <div class="boot" id="boot"></div>
      </div>
    </div>
    <div class="stand"></div>
    <div class="base"></div>
    <div class="shadow"></div>
  </div>
</div>

<div class="vignette"></div>

<div class="controls">
  <button id="replayBtn" type="button">Replay</button>
  <button id="loopBtn" type="button">Loop: on</button>
</div>

<script>
(function () {
  "use strict";

  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------------- data (fixed by the brief; counter equals the tile sum) ---------------- */

  var HIST = [54, 61, 57, 63, 58, 66, 71, 64, 59, 62, 68, 63, 57, 62];
  var FC   = [59, 66, 71, 77, 68, 55, 50];
  var SPREAD = [4, 6, 8, 10, 11, 12, 13];
  var TOTAL = 446;                          /* 59+66+71+77+68+55+50 */
  var PLAN = "Plan: Thu roster needs 2 locum shifts. Reorder 2 supply items.";

  /* ---------------- chart geometry ---------------- */

  var SVGNS = "http://www.w3.org/2000/svg";
  var W = 1152, H = 266;
  var ML = 44, MR = 16, MT = 14, MB = 32;
  var plotW = W - ML - MR, plotH = H - MT - MB;
  var Y0 = 34, Y1 = 96;
  var N = HIST.length + FC.length;          /* 21 points, indices 0..20 */

  function px(i) { return ML + (i / (N - 1)) * plotW; }
  function py(v) { return MT + ((Y1 - v) / (Y1 - Y0)) * plotH; }

  function el(name, attrs) {
    var e = document.createElementNS(SVGNS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  var svg = document.getElementById("chart");

  /* grid + labels */
  var gGrid = el("g", { id: "gGrid", opacity: 0 });
  [40, 55, 70, 85].forEach(function (v) {
    gGrid.appendChild(el("line", { class: "grid-line", x1: ML, x2: W - MR, y1: py(v), y2: py(v) }));
    var t = el("text", { class: "grid-label", x: ML - 9, y: py(v) + 4, "text-anchor": "end" });
    t.textContent = v;
    gGrid.appendChild(t);
  });
  var past = el("text", { class: "axis-label", x: px(2), y: H - 10 });
  past.textContent = "PAST 14 DAYS";
  gGrid.appendChild(past);
  svg.appendChild(gGrid);

  /* confidence band, revealed by a clip rectangle */
  var histEndX = px(HIST.length - 1);
  var clip = el("clipPath", { id: "bandClip" });
  var clipRect = el("rect", { x: histEndX, y: 0, width: 0, height: H });
  clip.appendChild(clipRect);
  var defs = el("defs", {});
  defs.appendChild(clip);
  svg.appendChild(defs);

  var last = HIST[HIST.length - 1];
  var upPts = [[histEndX, py(last + 2)]];
  var loPts = [[histEndX, py(last - 2)]];
  FC.forEach(function (v, i) {
    var x = px(HIST.length + i);
    upPts.push([x, py(v + SPREAD[i])]);
    loPts.push([x, py(v - SPREAD[i])]);
  });
  var bandD = "M" + upPts.map(function (p) { return p[0] + "," + p[1]; }).join(" L") +
              " L" + loPts.reverse().map(function (p) { return p[0] + "," + p[1]; }).join(" L") + " Z";
  var gBand = el("g", { "clip-path": "url(#bandClip)" });
  gBand.appendChild(el("path", { id: "band", d: bandD }));
  svg.appendChild(gBand);

  /* historical line */
  var histD = "M" + HIST.map(function (v, i) { return px(i) + "," + py(v); }).join(" L");
  var histPath = el("path", { id: "histPath", d: histD });
  svg.appendChild(histPath);
  var histLen = 0;

  /* divider */
  var divX = px(HIST.length - 0.5);
  svg.appendChild(el("line", { id: "divider", x1: divX, x2: divX, y1: MT - 4, y2: MT + plotH + 6 }));
  var divLab = el("text", { id: "dividerLabel", x: divX + 10, y: MT + 8 });
  divLab.textContent = "FORECAST";
  svg.appendChild(divLab);

  /* forecast line (starts at the last actual point) */
  var fcD = "M" + histEndX + "," + py(last) +
            FC.map(function (v, i) { return " L" + px(HIST.length + i) + "," + py(v); }).join("");
  var fcPath = el("path", { id: "fcPath", d: fcD });
  svg.appendChild(fcPath);
  var fcLen = 0;

  /* forecast day letters */
  var gDays = el("g", { opacity: 0, id: "gDays" });
  ["M", "T", "W", "T", "F", "S", "S"].forEach(function (d, i) {
    var t = el("text", { class: "day-label", x: px(HIST.length + i), y: H - 10, "text-anchor": "middle" });
    t.textContent = d;
    gDays.appendChild(t);
  });
  svg.appendChild(gDays);

  /* tracer dot */
  var halo = el("circle", { id: "tracerHalo", r: 11, cx: histEndX, cy: py(last) });
  var tracer = el("circle", { id: "tracer", r: 5, cx: histEndX, cy: py(last) });
  svg.appendChild(halo);
  svg.appendChild(tracer);

  histLen = histPath.getTotalLength();
  fcLen = fcPath.getTotalLength();
  histPath.setAttribute("stroke-dasharray", histLen);
  histPath.setAttribute("stroke-dashoffset", histLen);
  fcPath.setAttribute("stroke-dasharray", fcLen);
  fcPath.setAttribute("stroke-dashoffset", fcLen);

  /* ---------------- scale the fixed 1280x720 dashboard into the screen ---------------- */

  var screen = document.getElementById("screen");
  var dashWrap = document.getElementById("dashWrap");
  function fit() {
    var s = screen.getBoundingClientRect().width / 1280;
    dashWrap.style.transform = "scale(" + s + ")";
  }
  window.addEventListener("resize", fit);
  fit();

  /* ---------------- easing ---------------- */

  function clamp01(v) { return Math.max(0, Math.min(1, v)); }
  function outCubic(p)   { return 1 - Math.pow(1 - p, 3); }
  function inOutCubic(p) { return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; }
  function outBack(p) {
    var c = 1.70158, c3 = c + 1;
    return 1 + c3 * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2);
  }

  /* ---------------- timeline ----------------
     0.0 - 0.9 s   power on flicker
     0.9 - 1.5 s   header and KPI shell fade in
     1.2 - 3.2 s   historical line draws, grid fades in
     3.2 - 3.7 s   divider appears
     3.5 - 6.6 s   forecast traces, band expands, counter climbs
     6.8 - 7.3 s   peak badge pops
     6.9 - 8.6 s   tiles cascade, numbers count up
     8.8 - 9.6 s   caption fades in
     9.6 - 11.6 s  plan line types out
     11.6 - 14.6 s ambient hold
     14.6 - 15.2 s screen fades to black, then the cycle restarts        */

  var CYCLE = 15200, HOLD_END = 14600;

  var boot = document.getElementById("boot");
  var bigNum = document.getElementById("bigNum");
  var peak = document.getElementById("peakBadge");
  var caption = document.getElementById("caption");
  var action = document.getElementById("action");
  var planText = document.getElementById("planText");
  var caret = document.getElementById("caret");
  var tiles = Array.prototype.slice.call(document.querySelectorAll(".tile"));

  var items = [];
  function add(s, e, fn) { items.push({ s: s, e: e, fn: fn }); }

  function fadeIn(id, s, e, dy) {
    var node = document.getElementById(id);
    add(s, e, function (p) {
      var q = outCubic(p);
      node.style.opacity = q;
      node.style.transform = "translateY(" + (dy * (1 - q)) + "px)";
    });
  }

  /* power on: black overlay flickers away */
  add(0, 900, function (p) {
    var o;
    if      (p < 0.30) o = 1;
    else if (p < 0.38) o = 0.15;
    else if (p < 0.46) o = 0.85;
    else if (p < 0.56) o = 0.05;
    else if (p < 0.64) o = 0.5;
    else               o = (1 - p) / 0.36 * 0.5;
    boot.style.opacity = clamp01(o);
  });

  fadeIn("hdRow", 900, 1450, 10);
  fadeIn("kpiBlock", 1050, 1600, 10);
  fadeIn("chartPanel", 1100, 1650, 14);

  /* grid, then historical line */
  add(1200, 1900, function (p) { document.getElementById("gGrid").setAttribute("opacity", outCubic(p)); });
  add(1200, 3200, function (p) {
    histPath.setAttribute("stroke-dashoffset", histLen * (1 - inOutCubic(p)));
  });

  /* divider */
  add(3200, 3700, function (p) {
    var q = outCubic(p);
    document.getElementById("divider").style.opacity = q * 0.9;
    document.getElementById("dividerLabel").style.opacity = q * 0.85;
    document.getElementById("gDays").setAttribute("opacity", q);
  });

  /* forecast trace + band + tracer + counter */
  add(3500, 6600, function (p) {
    var q = inOutCubic(p);
    fcPath.setAttribute("stroke-dashoffset", fcLen * (1 - q));
    var pt = fcPath.getPointAtLength(fcLen * q);
    tracer.setAttribute("cx", pt.x); tracer.setAttribute("cy", pt.y);
    halo.setAttribute("cx", pt.x);   halo.setAttribute("cy", pt.y);
    var vis = (p > 0 && p < 1) ? 1 : (p >= 1 ? 0.85 : 0);
    tracer.style.opacity = vis;
    halo.style.opacity = vis * 0.8;
    clipRect.setAttribute("width", Math.max(0, pt.x - histEndX + 14));
    bigNum.textContent = Math.round(TOTAL * outCubic(p));
  });

  /* peak badge pop */
  add(6800, 7300, function (p) {
    var q = outBack(p);
    peak.style.opacity = clamp01(p * 2);
    peak.style.transform = "scale(" + (0.6 + 0.4 * q) + ")";
  });

  /* tiles cascade */
  tiles.forEach(function (tile, i) {
    var s = 6900 + i * 170, e = s + 620;
    var target = parseInt(tile.getAttribute("data-v"), 10);
    var num = tile.querySelector(".n");
    add(s, e, function (p) {
      var q = outCubic(p);
      tile.style.opacity = q;
      tile.style.transform = "translateY(" + (14 * (1 - q)) + "px) scale(" + (0.96 + 0.04 * q) + ")";
      num.textContent = Math.round(target * q);
    });
  });

  /* caption, then the plan line types out */
  add(8800, 9600, function (p) { caption.style.opacity = outCubic(p) * 0.95; });
  add(9500, 9900, function (p) {
    action.style.opacity = outCubic(p);
    caret.style.opacity = p > 0.5 ? 1 : 0;
  });
  add(9900, 11700, function (p) {
    planText.textContent = PLAN.slice(0, Math.round(PLAN.length * p));
  });

  /* fade to black before the loop restarts */
  add(HOLD_END, CYCLE, function (p) { boot.style.opacity = inOutCubic(p); });

  /* ---------------- particles ---------------- */

  var canvas = document.getElementById("particles");
  var ctx = canvas.getContext("2d");
  var dots = [];
  function seedDots() {
    canvas.width = window.innerWidth * (window.devicePixelRatio || 1);
    canvas.height = window.innerHeight * (window.devicePixelRatio || 1);
    if (!dots.length) {
      for (var i = 0; i < 64; i++) {
        dots.push({
          x: Math.random(), y: Math.random(),
          r: 0.6 + Math.random() * 1.6,
          vy: 0.008 + Math.random() * 0.02,
          vx: (Math.random() - 0.5) * 0.006,
          a: 0.08 + Math.random() * 0.3,
          tw: Math.random() * Math.PI * 2
        });
      }
    }
  }
  window.addEventListener("resize", seedDots);
  seedDots();

  function drawDots(t) {
    var w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    for (var i = 0; i < dots.length; i++) {
      var d = dots[i];
      var y = (d.y - (t / 1000) * d.vy) % 1; if (y < 0) y += 1;
      var x = (d.x + (t / 1000) * d.vx) % 1; if (x < 0) x += 1;
      var alpha = d.a * (0.65 + 0.35 * Math.sin(d.tw + t / 900));
      ctx.beginPath();
      ctx.arc(x * w, y * h, d.r * (window.devicePixelRatio || 1), 0, Math.PI * 2);
      ctx.fillStyle = "rgba(140, 175, 235," + alpha.toFixed(3) + ")";
      ctx.fill();
    }
  }

  /* ---------------- engine ---------------- */

  var looping = true;
  var startT = null;
  var frozen = false;

  function applyAll(t) {
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      var p = clamp01((t - it.s) / (it.e - it.s));
      it.fn(p);
    }
  }

  function frame(now) {
    if (startT === null) startT = now;
    var t = now - startT;

    if (t >= CYCLE) {
      if (looping) { startT = now; t = 0; }
      else { t = HOLD_END - 1; frozen = true; }
    }
    if (frozen) t = HOLD_END - 1;

    applyAll(t);
    drawDots(now);
    requestAnimationFrame(frame);
  }

  function finalState() {
    applyAll(HOLD_END - 1);
    boot.style.opacity = 0;
    drawDots(0);
  }

  document.getElementById("replayBtn").addEventListener("click", function () {
    frozen = false;
    startT = null;
    if (reduced) { reduced = false; requestAnimationFrame(frame); }
  });
  var loopBtn = document.getElementById("loopBtn");
  loopBtn.addEventListener("click", function () {
    looping = !looping;
    frozen = false;
    loopBtn.textContent = "Loop: " + (looping ? "on" : "off");
  });

  if (reduced) {
    finalState();
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
