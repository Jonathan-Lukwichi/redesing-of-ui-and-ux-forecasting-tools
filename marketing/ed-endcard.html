<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HealthForecast, closing title card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --room0: #060a0d;
    --room1: #12222b;
    --ink: #e8eef7;
    --ink-2: #9db0c7;
    --ink-3: #64748b;
    --green: #16a679;
    --panel-line: rgba(148, 180, 255, 0.13);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }

  body {
    background: radial-gradient(120% 95% at 50% 38%, var(--room1) 0%, var(--room0) 65%);
    font-family: "Inter", "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center;
  }

  .dotfield {
    position: fixed; inset: -6%;
    background-image: radial-gradient(rgba(64, 205, 180, 0.2) 1.2px, transparent 1.4px);
    background-size: 34px 34px;
    -webkit-mask-image: radial-gradient(55% 50% at 50% 30%, rgba(0, 0, 0, 0.8), transparent 80%);
    mask-image: radial-gradient(55% 50% at 50% 30%, rgba(0, 0, 0, 0.8), transparent 80%);
    animation: drift 40s ease-in-out infinite alternate;
  }
  @keyframes drift {
    0%   { transform: translate(0, 0); }
    100% { transform: translate(28px, -18px); }
  }

  .glow {
    position: fixed;
    left: 50%; top: 46%;
    width: 100vh; height: 100vh;
    transform: translate(-50%, -50%);
    background: radial-gradient(closest-side,
      rgba(42, 150, 145, 0.16),
      rgba(22, 166, 121, 0.05) 55%,
      transparent 78%);
  }

  .vignette {
    position: fixed; inset: 0;
    background: radial-gradient(115% 95% at 50% 42%, transparent 55%, rgba(0, 0, 0, 0.6) 100%);
    pointer-events: none;
  }

  .card {
    position: relative;
    text-align: center;
    display: flex; flex-direction: column; align-items: center;
    gap: 26px;
  }

  .reveal {
    opacity: 0;
    transform: translateY(16px);
    animation: rise 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
  }
  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }

  .wordmark {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 700;
    font-size: 74px;
    letter-spacing: 0.14em;
    animation-delay: 1.65s;
  }
  .wordmark b { color: var(--green); font-weight: 700; text-shadow: 0 0 34px rgba(22, 166, 121, 0.45); }

  .rule {
    width: 320px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(148, 180, 255, 0.35), transparent);
    animation-delay: 1.95s;
  }

  .tag {
    font-family: "Space Grotesk", sans-serif;
    font-size: 34px; font-weight: 600;
    letter-spacing: -0.01em;
    animation-delay: 2.15s;
  }
  .tag b { color: var(--green); font-weight: 600; }

  .sub {
    font-size: 19px; font-weight: 400;
    color: var(--ink-2);
    animation-delay: 2.35s;
  }

  .urlchip {
    font-size: 17px; font-weight: 500;
    color: var(--ink);
    padding: 11px 26px;
    border: 1px solid rgba(22, 166, 121, 0.45);
    border-radius: 999px;
    background: rgba(22, 166, 121, 0.1);
    box-shadow: 0 0 26px rgba(22, 166, 121, 0.18);
    letter-spacing: 0.03em;
    animation-delay: 2.6s;
  }

  .brand {
    font-family: "Space Grotesk", sans-serif;
    font-size: 13px; font-weight: 600;
    letter-spacing: 0.34em;
    color: var(--ink-3);
    margin-top: 8px;
    animation-delay: 2.85s;
  }
</style>
</head>
<body>

<div class="dotfield"></div>
<div class="glow"></div>

<div class="card">
  <div class="wordmark reveal">HEALTH<b>FORECAST</b></div>
  <div class="rule reveal"></div>
  <div class="tag reveal">See <b>next week</b> before it happens.</div>
  <div class="sub reveal">AI demand forecasting for emergency departments</div>
  <div class="urlchip reveal">healthforecast.jlwanalytics.com</div>
  <div class="brand reveal">JLW ANALYTICS</div>
</div>

<div class="vignette"></div>

</body>
</html>
