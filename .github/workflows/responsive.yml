name: Responsive verification

on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'index.html', 'package*.json', 'playwright.config.js']
  pull_request:
    paths: ['src/**', 'tests/**', 'index.html', 'package*.json', 'playwright.config.js']

jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run build
      # Fails the build on horizontal overflow, chart console errors, clipped
      # card text or sub-24px hit areas at phone widths (320px included).
      - run: npx playwright test --workers=2
